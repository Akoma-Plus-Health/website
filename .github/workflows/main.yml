name: Build and Deploy Vue 3 to cPanel

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Vue App
        run: |
          npm run build
          test -d dist || (echo "❌ Build failed: dist not found" && exit 1)

      - name: Backup Current Live Site on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SFTP_SERVER }}
          username: ${{ secrets.SFTP_USERNAME }}
          key: ${{ secrets.SFTP_PRIVATE_KEY }}
          port: 22
          script: |
            mkdir -p ~/backups
            if [ -d "${{ secrets.DEPLOY_PATH }}" ]; then
              tar -czf ~/backups/site_$(date +%F_%H-%M-%S).tar.gz ${{ secrets.DEPLOY_PATH }}
            fi

      - name: Deploy Vue Build to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SFTP_SERVER }}
          username: ${{ secrets.SFTP_USERNAME }}
          key: ${{ secrets.SFTP_PRIVATE_KEY }}
          protocol: sftp
          port: 22
          local-dir: dist/
          server-dir: ${{ secrets.DEPLOY_PATH }}
          exclude: |
            **/.git*
            **/.env
            **/.htaccess
            **/node_modules/**

      - name: Verify Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SFTP_SERVER }}
          username: ${{ secrets.SFTP_USERNAME }}
          key: ${{ secrets.SFTP_PRIVATE_KEY }}
          port: 22
          script: |
            ls -la ${{ secrets.DEPLOY_PATH }}
            echo "✅ Deployment successful!"
